# Configuração do anunciar — copie para ~/.config/anunciar/config.toml
# (ele é criado automaticamente com estes padrões na primeira execução).
# Todos os valores abaixo são os padrões; edite para mudar o cenário de venda
# sem tocar no código. Use `anunciar --config /outro/config.toml ...` para
# apontar para uma configuração alternativa em uma execução específica.

[listing]
site_id = "MLB"                 # Mercado Livre Brasil
condition = "used"              # "used" ou "new" — padrão: sempre usado
listing_type = "premium"        # "premium" é resolvido dinamicamente (hoje: gold_pro);
                                # também aceita um id literal, ex. "gold_special"
available_quantity = 1
warranty = "none"               # "none" = Sem garantia
availability_days = 1           # prazo de disponibilidade/expedição (sale_term)

[shipping]
free_shipping_threshold = 200.00   # preço > limite → frete grátis (por conta do vendedor)
flex = false                       # nunca ativar Flex

[pricing]
price_ending = ".90"               # preço final sempre termina em ,90
import_multiplier_min = 2.5        # item raro só encontrado no exterior:
import_multiplier_max = 3.0        # preço BRL convertido × 2.5–3.0
undercut_strategy = "slightly_below_cheapest_similar_condition"

[description]
rare_import_line = "ITEM RARO, importado do {país}. Item de colecionador!"
closing_line = "As fotos são do item real que será enviado. Envio com embalagem protegida."
