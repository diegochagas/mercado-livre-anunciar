[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercado-livre-anunciar"
version = "0.1.0"
description = "Cria anúncios no Mercado Livre a partir de uma pasta de fotos de um produto"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
anunciar = "anunciar.cli:main"
anunciar-bot = "anunciar.bot:main"

[tool.setuptools.packages.find]
include = ["anunciar*"]
